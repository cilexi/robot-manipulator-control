# nomal_backstepping：第五关节 No-RL 反步控制实验
#
# 保留：输出障碍变换、两层反步、core-function 鲁棒项、theta 自适应。
# 删除：Actor/Critic、RBF、Bellman 残差、伪 Huber 与全部 NN 权重代码。

hardware_enable = true
ready_pose_confirmed = true
perform_ready_move = false
power_off_on_exit = true
robot_ip = 192.168.2.200
local_ip = 192.168.2.100
ready_q = 0 0 0 0 0 0
ready_move_speed = 0.05

# 第五关节普通正弦参考；默认周期 12 s、共 2 周期。
reference_amplitude5 = 0.02
reference_omega5 = 0.5235987756
reference_cycles = 1
final_hold_time = 3.0#最终保持时间

# 相对实验起点的位移约束：-output_bound5 < q5-q_init5 < output_bound5；
# 关闭时 z1 直接退化为 q5-qd5。
enable_output_barrier = true
output_bound5 = 0.10#约束边界（为对称设立）此时约束边界仅为固定常数，在cfg中定义
barrier_b0 = 2.0
barrier_bf = 1.0
barrier_abort_ratio = 0.90#当障碍变换比率超过该值时，触发安全中止？

# 两层误差反馈分别直接使用 k1_5 和 k2_5。
k1_5 = 112
k2_5 = 187
alpha_limit5 = 3
alpha_dot_limit5 = 3
alpha_dot_filter = 0.02
virtual_accel_limit5 = 50

# 鲁棒项 nu_r=theta_hat*phi^2*z2/(2*iota^2)。
enable_theta_adaptation = true
freeze_theta_on_virtual_saturation = true
iota = 1
theta_initial = 0.05
gamma_theta = 0.1
sigma_theta = 1
theta_max = 5.0
adaptation_start_time = 1.0

# tau5=nominal_inertia5*v。该值必须根据第五关节实际惯量/实验辨识复核。
nominal_inertia5 = 0.045

# 关节 1~4、6 仅用于保持 q_init，不进入第五关节反步律。
hold_kp = 2.0
hold_kd = 0.10

command_ramp_time = 1.0
stop_ramp_time = 1.0
sdk_filter_cutoff_hz = 30.0
tau_limit = 0.40 0.40 0.40 0.40 1 0.30
tau_rate_limit = 10 10 10 10 10 10
joint5_abort_error = 0.08
joint5_displacement_limit = 0.10
abort_velocity = 0.30 0.30 0.30 0.30 0.30 0.30
hold_joint_drift_limit = 0.02 0.02 0.02 0.02 0 0.02
log_decimation = 10
