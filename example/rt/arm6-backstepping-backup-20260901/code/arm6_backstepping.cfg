# arm6_backstepping：第六关节 No-RL 反步控制实验
#
# 保留：输出障碍变换、两层反步、core-function 鲁棒项、theta 自适应。
# 删除：Actor/Critic、RBF、Bellman 残差、伪 Huber 与全部 NN 权重代码。

hardware_enable = true
ready_pose_confirmed = true
perform_ready_move = false
power_off_on_exit = true
robot_ip = 192.168.2.200
local_ip = 192.168.2.100
ready_q = 0 0 0 0 0 0
ready_move_speed = 0.05

# 第六关节普通正弦参考；默认周期 12 s、共 2 周期。
reference_amplitude6 = 0.02#正弦幅值
reference_omega6 = 0.523598775598#正弦角频率
reference_cycles = 2#正弦周期
final_hold_time = 3.0#最终保持时间

# 机械臂绝对关节角固定约束：-output_bound6 < q6 < output_bound6；
# 关闭时 z1 直接退化为 q6-qd6。
enable_output_barrier = true
output_bound6 = 0.10#约束边界（为对称设立）此时约束边界仅为固定常数，在cfg中定义
barrier_b0 = 2.0
barrier_bf = 1.0
barrier_abort_ratio = 0.90#当障碍变换比率超过该值时，触发安全中止？

# 两层误差反馈分别直接使用 k1_6 和 k2_6。
k1_6 = 6.0
k2_6 = 10.0
alpha_limit6 = 0.30
alpha_dot_limit6 = 3.0
alpha_dot_filter = 0.02
virtual_accel_limit6 = 8.0

# 鲁棒项 nu_r=theta_hat*phi^2*z2/(2*iota^2)。
enable_theta_adaptation = true
freeze_theta_on_virtual_saturation = true
iota = 1.0
theta_initial = 0.05
gamma_theta = 0.05
sigma_theta = 0.10
theta_max = 5.0
adaptation_start_time = 1.0

# tau6=nominal_inertia6*v。该值必须根据第六关节实际惯量/实验辨识复核。
nominal_inertia6 = 0.02

# 关节 1~5 仅用于保持 q_init，不进入第六关节反步律。
hold_kp = 2.0
hold_kd = 0.10

command_ramp_time = 1.0
stop_ramp_time = 1.0
sdk_filter_cutoff_hz = 30.0
tau_limit = 0.40 0.40 0.40 0.40 0.40 0.30
tau_rate_limit = 10 10 10 10 10 10
joint6_abort_error = 0.08
joint6_displacement_limit = 0.10
abort_velocity = 0.30 0.30 0.30 0.30 0.30 0.30
hold_joint_drift_limit = 0.02 0.02 0.02 0.02 0.02 0
log_decimation = 10
